app = "informatica-medica"
primary_region = "mia"

[build]

[env]
  FLASK_ENV = "production"
  UPLOAD_FOLDER = "/app/static/uploads"
  MAX_CONTENT_LENGTH = "16777216"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/health"

[mounts]
  source = "uploads_volume"
  destination = "/app/static/uploads"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512